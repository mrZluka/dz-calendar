# Забирає готові сторінки ДЗ (out/dz/*.html) з приватного репозиторію mrZluka/telegram-homework
# і додає їх у календар через його ж site_publish.py. Доступ до приватного репозиторію — read-only
# deploy key у секреті HW_DEPLOY_KEY. Публікація: GitHub Pages збирає main після push.
name: sync-dz

on:
  schedule:
    - cron: "30 13 * * *"   # 15:30 за Києвом узимку (UTC+2); влітку (UTC+3) це 16:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dz
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Клон приватного репозиторію (лише site_publish.py і out/dz)
        env:
          HW_DEPLOY_KEY: ${{ secrets.HW_DEPLOY_KEY }}
        run: |
          test -n "$HW_DEPLOY_KEY" || { echo "::error::секрет HW_DEPLOY_KEY порожній"; exit 2; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HW_DEPLOY_KEY" > ~/.ssh/hw_key && chmod 600 ~/.ssh/hw_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/hw_key -o IdentitiesOnly=yes"
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:mrZluka/telegram-homework.git "$RUNNER_TEMP/hw"
          git -C "$RUNNER_TEMP/hw" sparse-checkout set out/dz
          ls "$RUNNER_TEMP/hw"/out/dz/*.html

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Додати/оновити сторінки, що змінилися
        env:
          DZ_SITE_DIR: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP/hw"/out/dz/*.html; do
            python "$RUNNER_TEMP/hw/site_publish.py" add --if-changed "$f"
          done

      - name: Коміт і push (Pages оновиться сам)
        run: |
          git config user.name "dz-sync[bot]"
          git config user.email "dz-sync@users.noreply.github.com"
          git add -A dz
          if git diff --cached --quiet; then
            echo "Змін немає"
          else
            git commit -q -m "ДЗ: синхронізація $(date -u +%Y-%m-%d)"
            git push -q origin HEAD:main
          fi
