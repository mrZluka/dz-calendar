<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Домашні завдання</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e4e1d8;--acc:#7a5af5;--badge:#efe9ff;--today:#ffb74d}
@media (prefers-color-scheme:dark){:root{--bg:#15151a;--card:#1f1f26;--ink:#ecebe6;--muted:#9c9a92;--line:#33333d;--acc:#a98cff;--badge:#2b2540;--today:#ffb74d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.next{display:block;background:var(--acc);color:#fff;text-decoration:none;border-radius:14px;padding:14px 16px;margin:0 0 18px;font-weight:600}
.next small{display:block;font-weight:400;opacity:.9}
.next.none{background:var(--card);color:var(--muted);border:1px solid var(--line);font-weight:400}
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h2{font-size:1.1rem;margin:0;text-transform:capitalize}
.calhead button{background:var(--badge);color:var(--acc);border:0;border-radius:10px;width:40px;height:36px;font-size:1.3rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:2px}
.wd.we{color:#c0564b}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:.95rem;color:var(--muted);text-decoration:none;position:relative;border:1px solid transparent}
.day.in{color:var(--ink)}
.day.has{background:var(--badge);color:var(--acc);font-weight:700;border-color:var(--acc)}
.day.has:hover{filter:brightness(.95)}
.day.today{outline:2px solid var(--today);outline-offset:-2px}
.day.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);margin-top:2px}
.day.empty{visibility:hidden}
h3{font-size:1rem;margin:22px 0 8px;color:var(--muted);font-weight:600}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
ul.list a{display:block;padding:10px 14px;text-decoration:none;color:var(--ink)}
ul.list .d{color:var(--acc);font-weight:700;margin-right:8px}
ul.list .s{display:block;color:var(--muted);font-size:.85rem}
.legend{color:var(--muted);font-size:.8rem;margin-top:10px}
.err{color:#c0564b}
footer{color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Домашні завдання</h1>
<p class="sub">Натисни на день з крапкою, щоб відкрити завдання.</p>
<a class="next none" id="next" href="#">Завантаження…</a>
<section class="cal">
  <div class="calhead">
    <button id="prev" aria-label="Попередній місяць">‹</button>
    <h2 id="month"></h2>
    <button id="fwd" aria-label="Наступний місяць">›</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="legend">Помаранчева рамка — сьогодні. Фіолетові дні — є сторінка із завданнями.</p>
</section>
<h3>Усі сторінки</h3>
<ul class="list" id="list"></ul>
<footer>Сторінки збираються з повідомлень навчальної групи та підручників.</footer>
</main>
<script src="dz/index.js"></script>
<script>
(function () {
  var MONTHS = ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
  var MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
  var WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  var WD_LONG = ["понеділок","вівторок","середа","четвер","п'ятниця","субота","неділя"];
  var entries = (window.DZ_INDEX || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var byDate = {};
  entries.forEach(function (e) { byDate[e.date] = e; });

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function human(s) { var d = parse(s); return WD_LONG[(d.getDay() + 6) % 7] + ", " + d.getDate() + " " + MONTHS_GEN[d.getMonth()]; }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todayIso = iso(today);
  var view = new Date(today.getFullYear(), today.getMonth(), 1);

  var nextEl = document.getElementById("next");
  var upcoming = entries.filter(function (e) { return e.date >= todayIso; })[0];
  var latest = entries[entries.length - 1];
  if (!entries.length) {
    nextEl.textContent = "Сторінок із завданнями ще немає.";
    nextEl.className = "next none";
  } else if (upcoming) {
    nextEl.className = "next";
    nextEl.href = upcoming.file;
    nextEl.innerHTML = (upcoming.date === todayIso ? "На сьогодні" : "Найближче") + ": " + human(upcoming.date) +
      "<small>" + (upcoming.title || "") + "</small>";
  } else {
    nextEl.className = "next";
    nextEl.href = latest.file;
    nextEl.innerHTML = "Останнє: " + human(latest.date) + "<small>" + (latest.title || "") + "</small>";
  }

  function render() {
    document.getElementById("month").textContent = MONTHS[view.getMonth()] + " " + view.getFullYear();
    var grid = document.getElementById("grid");
    grid.innerHTML = "";
    WD.forEach(function (w, i) {
      var h = document.createElement("div"); h.className = "wd" + (i >= 5 ? " we" : ""); h.textContent = w; grid.appendChild(h);
    });
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    var offset = (first.getDay() + 6) % 7;
    for (var i = 0; i < offset; i++) { var b = document.createElement("div"); b.className = "day empty"; grid.appendChild(b); }
    var days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (var d = 1; d <= days; d++) {
      var date = new Date(view.getFullYear(), view.getMonth(), d);
      var key = iso(date);
      var e = byDate[key];
      var el = document.createElement(e ? "a" : "div");
      el.className = "day in" + (e ? " has" : "") + (key === todayIso ? " today" : "");
      el.textContent = d;
      if (e) { el.href = e.file; el.title = e.title || key; }
      grid.appendChild(el);
    }
  }
  document.getElementById("prev").onclick = function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
  document.getElementById("fwd").onclick = function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
  render();

  var list = document.getElementById("list");
  if (!entries.length) {
    list.innerHTML = '<li><span style="display:block;padding:10px 14px;color:var(--muted)">Поки порожньо.</span></li>';
  }
  entries.slice().reverse().forEach(function (e) {
    var li = document.createElement("li");
    var a = document.createElement("a"); a.href = e.file;
    var d = parse(e.date);
    a.innerHTML = '<span class="d">' + WD[(d.getDay() + 6) % 7] + " " + pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "</span>" +
      (e.title || "") + (e.subjects && e.subjects.length ? '<span class="s">' + e.subjects.join(" · ") + "</span>" : "");
    li.appendChild(a); list.appendChild(li);
  });
})();
</script>
</body>
</html>
